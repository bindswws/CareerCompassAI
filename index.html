const ROLE_IMAGES={"school": "https://images.unsplash.com/photo-1509062522246-3755977927d7?auto=format&fit=crop&w=900&q=85", "college": "https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=900&q=85", "employed": "https://images.unsplash.com/photo-1524758631624-e2822e304c36?auto=format&fit=crop&w=900&q=85"};
const CAREER_LIBRARY_URL="https://ncs.gov.in/";
const features=["math","coding","science","data","business","creative","communication","problem_solving","teamwork","research","people","leadership","technology"];
let state={type:null,index:0,answers:[]};
const app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function save(){localStorage.setItem('careerPathfinderStateV3',JSON.stringify(state))}
function clearSave(){localStorage.removeItem('careerPathfinderStateV3')}
function start(type){state={type,index:0,answers:[]};save();renderQuestion()}
function renderRole(){app.innerHTML=`<section class="panel hero"><div class="eyebrow">START YOUR DISCOVERY</div><h2>Which version of your career story are you writing?</h2><p class="sub">Choose your current stage. The experience changes the questions you see.</p><div class="rolegrid" style="margin-top:24px"><div class="card" onclick="start('school')"><img src="${ROLE_IMAGES.school}"><div class="cardbody"><b>🎓 Class 12 Student</b><div class="hint">Explore subjects, interests, strengths and future study directions.</div></div></div><div class="card" onclick="start('college')"><img src="${ROLE_IMAGES.college}"><div class="cardbody"><b>🎓 College Student</b><div class="hint">Connect your current course, skills and interests with career directions.</div></div></div><div class="card" onclick="start('employed')"><img src="${ROLE_IMAGES.employed}"><div class="cardbody"><b>💼 Already Employed</b><div class="hint">Explore reskilling, role changes, growth paths and new career directions.</div></div></div></div><div class="notice" style="margin-top:22px"><b>✨ Your answers build a profile, not a label.</b><br>For Class 12 students, subjects can be combined — for example <b>Math + Art + Computer</b>.</div></section>`}
function dots(qs){return `<div class="stepdots">${qs.map((_,i)=>`<span class="stepdot ${i<state.index?'done':''} ${i===state.index?'active':''}">${i+1}</span>`).join('')}</div>`}
function renderQuestion(){const qs=DATA.q[state.type],q=qs[state.index];let selected=Array.isArray(state.answers[state.index])?state.answers[state.index]:[];const pct=Math.round(((state.index)/(qs.length-1))*100);const label=state.type==='school'?'Class 12':state.type==='college'?'College':'Employed';app.innerHTML=`<section class="panel"><div class="topline"><div><div class="qnum">QUESTION ${state.index+1} / ${qs.length}</div><h2>${esc(q.q)}</h2><p class="sub">${q.type==='multi'?'Pick every option that genuinely interests you. You can combine interests.':'Tap the picture that feels most like you.'}</p></div><span class="pill">${label}</span></div>${dots(qs)}<div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="choice-note">${q.type==='multi'?`Selected: <b>${selected.length}</b> — you can choose more than one`:''}</div><div class="grid">${q.options.map((o,i)=>`<div class="card ${selected.includes(i)?'selected':''}" onclick="choose(${i})"><div class="choicecheck">${selected.includes(i)?'✓':i+1}</div><img src="${o.image}" alt=""><div class="cardbody"><b>${esc(o.label)}</b></div></div>`).join('')}</div>${q.type==='multi'?`<div class="selectionbar"><div><b>${selected.length} selected</b><br><small>Mix interests to create a richer career profile.</small></div><button class="primary" onclick="next()" ${selected.length?'':'disabled'}>Continue →</button></div>`:`<div class="actions"><button class="secondary" onclick="prev()" ${state.index===0?'disabled':''}>← Back</button><span class="hint">Selecting an image continues automatically</span><span></span></div>`}</section>`}
function choose(i){const q=DATA.q[state.type][state.index];if(q.type==='multi'){let a=Array.isArray(state.answers[state.index])?state.answers[state.index]:[];state.answers[state.index]=a.includes(i)?a.filter(x=>x!==i):[...a,i];save();renderQuestion()}else{state.answers[state.index]=[i];save();setTimeout(next,220)}}
function next(){if(state.index+1<DATA.q[state.type].length){state.index++;save();renderQuestion()}else showResults()}
function prev(){if(state.index>0){state.index--;save();renderQuestion()}}
function vector(){let v=Array(DATA.careers[0].values.length).fill(0);let qs=DATA.q[state.type];state.answers.forEach((ans,qi)=>{if(!ans)return;for(const i of (Array.isArray(ans)?ans:[ans])){const o=qs[qi].options[i],idx=features.indexOf(o.feature);if(idx>=0)v[idx]+=o.weight}});return v}
function sim(a,b){let d=0,na=0,nb=0;for(let i=0;i<a.length;i++){d+=a[i]*b[i];na+=a[i]*a[i];nb+=b[i]*b[i]}return na&&nb?d/(Math.sqrt(na)*Math.sqrt(nb)):0}
function profileStats(){const v=vector();const names=[['🧠','Problem Solving','problem_solving'],['💻','Technology','coding'],['🎨','Creativity','creative'],['🤝','People','people']];return `<div class="profilepulse">${names.map(([ic,n,f])=>{const i=features.indexOf(f);const val=Math.round(((v[i]||0)/Math.max(1,DATA.q[state.type].length))*100);return `<div class="pulse"><strong>${ic} ${Math.min(100,val)}%</strong><span>${n}</span></div>`}).join('')}</div>`}
function showResults(){const v=vector();let rows=DATA.careers.map(c=>({...c,score:sim(v,c.values)})).sort((a,b)=>b.score-a.score).slice(0,3);const employed=state.type==='employed';app.innerHTML=`<section class="panel"><div class="topline"><div><div class="qnum">YOUR CAREER MAP</div><h2>${employed?'Your next career move starts here.':'Your profile opens several possible directions.'}</h2><p class="sub">${employed?'Your results are framed around roles, reskilling and organisations to explore.':'The matches reflect patterns in your answers. They are exploration prompts, not fixed predictions.'}</p></div><button class="secondary" onclick="reset()">↺ Start Again</button></div>${profileStats()}<div class="results"><div>${rows.map((c,i)=>{const pct=Math.round(c.score*100);const action=employed?'Tap to explore companies and career pathways.':'Tap to explore university pathways.';return `<div class="resultcard" onclick="showPath('${esc(c.course).replace(/'/g,"\\'")}')"><div style="display:flex;justify-content:space-between;gap:14px;align-items:center"><div><span class="pill">Direction ${i+1}</span><h3 style="margin:10px 0 0">${esc(c.course)}</h3><div class="hint">${esc(c.domain)}</div></div><div class="scoreRing" style="--score:${pct}"><b>${pct}%</b></div></div><div class="matchtags"><span class="matchtag">${employed?'💼 Work path':'🎓 Study path'}</span><span class="matchtag">🧭 Explore</span></div><p class="hint">${action}</p></div>`}).join('')}</div><div><div class="notice"><b>🧩 Your combination matters</b><p class="sub" style="margin-bottom:0">Your selected interests are combined before matching. A student choosing Math + Art is not forced into a single-subject path.</p></div><div class="qrbox"><img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(CAREER_LIBRARY_URL)}" alt="Career library QR"><div><span class="pill">🌍 CAREER EXPLORER</span><h3>12,000+ career choices to explore</h3><p class="sub">Scan the QR to open the career-resource hub. You can later replace this target with your school's public career library.</p><p class="source">The QR is a doorway to a career resource, not a claim that the QR itself contains 12,000 records.</p></div></div></div></div></section>`}
function showPath(course){if(state.type==='employed')showCompanies(course);else showUni(course)}
function showUni(course){const rows=DATA.uni.filter(x=>x.course===course),world=rows.filter(x=>x.region==='World'),india=rows.filter(x=>x.region==='India');app.innerHTML=`<section class="panel"><button class="secondary" onclick="showResults()">← Back to career map</button><div class="qnum" style="margin-top:18px">STUDY PATHWAY</div><h2 style="margin-bottom:4px">${esc(course)}</h2><p class="sub">Explore university pathways with official website QR codes.</p><div class="results"><div><h3>🌍 World</h3>${uniList(world)}</div><div><h3>🇮🇳 India</h3>${uniList(india)}</div></div></section>`}
function logoUrl(url){try{return 'https://www.google.com/s2/favicons?domain='+encodeURIComponent(new URL(url).hostname)+'&sz=128'}catch(e){return ''}}
function qrUrl(url,size=140){return 'https://api.qrserver.com/v1/create-qr-code/?size='+size+'x'+size+'&ecc=H&margin=8&data='+encodeURIComponent(url)}
function uniList(list){return list.slice(0,5).map(x=>`<div class="uni"><div class="unileft"><img class="unilogo" src="${logoUrl(x.url)}" alt="${esc(x.university)} logo" onerror="this.style.visibility='hidden'"><div><div class="companyrank">#${x.rank} · ${x.region}</div><b>${esc(x.university)}</b><br><a href="${x.url}" target="_blank" rel="noopener">Official website ↗</a></div></div><img class="qr" src="${qrUrl(x.url,120)}" alt="QR for ${esc(x.university)}"></div>`).join('')}
function showCompanies(course){const rows=DATA.companies.filter(x=>x.course===course),world=rows.filter(x=>x.region==='World'),india=rows.filter(x=>x.region==='India');app.innerHTML=`<section class="panel"><button class="secondary" onclick="showResults()">← Back to career map</button><div class="qnum" style="margin-top:18px">CAREER OPPORTUNITY MAP</div><h2 style="margin-bottom:4px">${esc(course)}</h2><p class="sub">You are already working, so this pathway focuses on organisations and career environments to explore for your next move. Each card now includes the organisation logo and a scannable careers QR code.</p><div class="results"><div><h3>🌍 Global organisations</h3><div class="companygrid">${companyList(world)}</div></div><div><h3>🇮🇳 India</h3><div class="companygrid">${companyList(india)}</div></div></div><div class="notice" style="margin-top:20px"><b>🚀 Make your next move strategic</b><p class="sub" style="margin-bottom:0">Compare the role requirements, your transferable skills, location, experience level and current openings before applying.</p></div></section>`}
function companyList(list){return list.slice(0,5).map(x=>`<div class="companycard"><div class="companybadge"><img src="${logoUrl(x.url)}" alt="${esc(x.company)} logo" onerror="this.parentElement.innerHTML='🏢'"></div><div style="min-width:0;flex:1"><div class="companyrank">#${x.rank} · ${x.region}</div><b>${esc(x.company)}</b><br><a href="${x.url}" target="_blank" rel="noopener">Explore careers ↗</a></div><img class="companyqr" src="${qrUrl(x.url,100)}" alt="QR for ${esc(x.company)}"></div>`).join('')}
renderRole();
</script><button id="installApp" onclick="installCareerCompass()" style="position:fixed;right:16px;bottom:16px;z-index:20;border:0;border-radius:999px;padding:11px 15px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-weight:800;box-shadow:0 10px 25px #4f46e544;cursor:pointer">📲 Use as App</button><script>
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;});
function installCareerCompass(){if(deferredInstallPrompt){deferredInstallPrompt.prompt();deferredInstallPrompt.userChoice.finally(()=>{deferredInstallPrompt=null;});}else{alert('On mobile Chrome/Edge, use the browser menu and choose “Add to Home screen” or “Install app”.');}}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script></body></html>
